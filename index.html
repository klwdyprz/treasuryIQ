<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Treasury Overview | TreasuryIQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="frame">
  <aside class="rail">
    <div class="mark">€</div>
    <nav id="nav" aria-label="Main"></nav>
    <div class="rail-b" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><circle cx="12" cy="12" r="2.6"/></svg>
      <svg class="out" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H5v16h5M16 8l4 4-4 4M20 12H9"/></svg>
      <div class="av">H</div>
    </div>
  </aside>
  <main>
    <header class="top">
      <div><h1 id="ttl">Treasury Overview</h1><small id="date"></small></div>
      <div class="tr">
        <span class="live"><i class="dot"></i>LIVE</span>
        <a class="bell" href="#risk" aria-label="Alerts: open Risk Monitoring"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0112 0v5l2 2H4zM10 21h4"/></svg></a>
      </div>
    </header>
    <div class="strip">
      <span><i class="dot"></i><b>LIVE</b></span>
      <span>Build v1.0 demo</span>
      <span>Company: Halden Foods Group (fictional)</span>
      <span>Sample data only</span>
      <button class="share" id="share" onclick="share(this)"></button>
    </div>
    <section id="view"></section>
  </main>
</div>
<script src="app.js" defer></script>
</body>
</html>
