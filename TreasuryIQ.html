<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Treasury Overview | TreasuryIQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Sans:wght@400;500;600;700&family=Fira+Sans+Condensed:wght@700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="frame">
  <aside class="rail">
    <div class="mark">₱</div>
    <nav id="nav" aria-label="Main"></nav>
    <div class="rail-b">
      <a class="ico" id="gear" href="#settings" data-tip="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><circle cx="12" cy="12" r="2.6"/></svg></a>
      <button class="ico" id="logout" onclick="logout()" data-tip="Log out" aria-label="Log out" hidden><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H5v16h5M16 8l4 4-4 4M20 12H9"/></svg></button>
      <div class="av" id="av" aria-hidden="true">T</div>
    </div>
  </aside>
  <main>
    <header class="top">
      <div><h1 id="ttl">Treasury Overview</h1><small id="date"></small></div>
      <div class="tr">
        <span class="live"><i class="dot"></i>LIVE</span>
        <a class="bell" href="#risk" aria-label="Alerts: open Risk Monitoring"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0112 0v5l2 2H4zM10 21h4"/></svg></a>
      </div>
    </header>
    <div class="strip">
      <span><i class="dot"></i><b>LIVE</b></span>
      <span id="co">TreasuryIQ</span>
      <span id="mode"></span>
      <button class="share" id="share" onclick="share(this)"></button>
    </div>
    <section id="view"></section>
  </main>
</div>
<div id="auth" hidden></div>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js" defer></script>
</body>
</html>
